{% set name = "validators" %}
{% set version = "0.36.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 92ad9ed00bbed320b784cec0ea90b213cf08904cf605b3d0852cfa4108e32a2c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
  run_constrained:
    # https://github.com/python-validators/validators/blob/0.36.0/pyproject.toml#L51
    - eth-hash >=0.7.0
    - pycryptodome >=3.6.6,<4

# eth-hash is not available in main channel.
{% set ignore_tests = " --ignore=tests/crypto_addresses/test_eth_address.py" %}
test:
  source_files:
    - tests
  imports:
    - validators
    - validators.crypto_addresses
    - validators.i18n
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv {{ ignore_tests }} tests
  requires:
    - pip
    - pytest >=9.0.3

about:
  home: https://github.com/python-validators/validators
  summary: Python Data Validation for Humans
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  description: |
    Python has all kinds of data validation tools, but every one of them
    seems to require defining a schema or form. I wanted to create a simple
    validation library where validating a simple value does not require
    defining a form or a schema.
  dev_url: https://github.com/python-validators/validators
  doc_url: https://nandgator.github.io/pyvalidators

extra:
  recipe-maintainers:
    - brl0
